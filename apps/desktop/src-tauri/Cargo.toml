[package]
name = "paios-desktop"
version = "2.0.0"
description = "Personal AI OS desktop shell"
authors = ["Personal AI OS"]
edition = "2021"

[lib]
name = "paios_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 1
codegen-units = 1
lto = false
incremental = false
